[project]
name = "batch_automation"
authors = [
    { name = "Arkotrix", email = "aravindsprint@gmail.com"}
]
description = "Auto batch number generation for Purchase Receipt, Subcontracting Receipt, and Stock Entry (Manufacture)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "batch_automation"
